apiVersion: apps/v1
kind: Deployment
metadata:
  name: execucao-api
  namespace: ${ENV}
  labels:
    app: execucao-api
    tags.datadoghq.com/env: "${ENV}"
    tags.datadoghq.com/service: oficina-execucao
    tags.datadoghq.com/version: "${VERSION}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execucao-api
  template:
    metadata:
      labels:
        app: execucao-api
        tags.datadoghq.com/env: "${ENV}"
        tags.datadoghq.com/service: oficina-execucao
        tags.datadoghq.com/version: "${VERSION}"
      annotations:
        checksum/secret: "${SECRET_HASH}"
        ad.datadoghq.com/execucao-api.logs: '[{"source": "python", "service": "oficina-execucao"}]'
        ad.datadoghq.com/execucao-api.checks: |
          {
            "http_check": {
              "init_config": {},
              "instances": [
                {
                  "name": "oficina-execucao-${ENV}",
                  "url": "http://%%host%%:5000/execucao/health",
                  "timeout": 5,
                  "tags": ["service:oficina-execucao", "env:${ENV}"]
                }
              ]
            }
          }
    spec:
      serviceAccountName: execucao
      containers:
        - name: execucao-api
          image: ${IMAGE}
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: execucao-config
            - secretRef:
                name: execucao-secret
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/env']
            - name: DD_SERVICE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/service']
            - name: DD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/version']
          readinessProbe:
            httpGet:
              path: /execucao/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /execucao/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
